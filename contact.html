<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Aurora Studio</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
  <h1 class="logo">Aurora Studio</h1>
  <div class="menu">
<input type="checkbox" id="toggle-list" hidden>   
 <label for="toggle-list" class="toggle-button"><h3>Menu</h3></label>

    
            <ul class="toggle-list">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>

</div>
</header>

  <main>
    <section>
      <h2>Contact Us</h2>
      <p>We’d love to hear from you! Fill out the form below:</p>

      <form action="#" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="subject">Subject:</label>
        <select id="subject" name="subject" required>
          <option value="">Choose a topic</option>
          <option value="design">Design</option>
          <option value="development">Development</option>
        </select>

        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="4" required></textarea>

        <button type="submit">Send</button>
      </form>

      <h3>Our Office</h3>
      <p>123 Aurora palace</p>
      <p>Email: aurorastudio@gmail.com</p>

      <img src="images/map.jpg" alt="Map placeholder">
    </section>
  </main>

  <footer>
    <p> 2025 Aurora Studio</p>
  </footer>

</body>
</html>
